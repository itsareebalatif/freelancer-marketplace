<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{% block title %}Freelancer Marketplace{% endblock %}</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f6f6f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #333333;
  }
  .preheader {
    display: none;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    font-size: 1px;
    line-height: 1px;
    color: transparent;
  }
  .wrapper {
    width: 100%;
    padding: 40px 16px;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e6e6e6;
    border-radius: 4px;
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    color: #111111;
    margin-bottom: 28px;
  }
  .heading {
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: 700;
    color: #111111;
  }
  .content p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #555555;
  }
  .highlight {
    font-size: 14px;
    font-weight: 600;
    color: #111111;
    background: #f6f6f6;
    border-radius: 4px;
    padding: 12px 16px;
    margin: 4px 0 20px;
  }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #999999;
  }
</style>
</head>
<body>
  <span class="preheader">{% block preheader %}{% endblock %}</span>
  <div class="wrapper">
    <div class="card">
      <div class="logo">Freelancer Marketplace</div>
      <h1 class="heading">{% block heading %}{% endblock %}</h1>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">This is an automated notification sent because of activity on your account.</div>
    </div>
  </div>
</body>
</html>
